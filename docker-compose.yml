version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - communication-service
      - workflow-service

  communication-service:
    build:
      context: .
      dockerfile: packages/communication-service/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env

  workflow-service:
    build:
      context: .
      dockerfile: packages/workflow-service/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
